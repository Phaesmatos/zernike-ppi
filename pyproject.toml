[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zernike-ppi"
version = "0.1.0"
description = "Configurable multichannel 2D Zernike descriptors for protein-protein interface research"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
zernike-ppi = "zernike_ppi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
